name: moodle-rag-local

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${MOODLE_LAB_DB_PASSWORD:?Set MOODLE_LAB_DB_PASSWORD in .env.moodle}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  moodle:
    build:
      context: ./docker/moodle
    environment:
      MOODLE_LAB_DB_PASSWORD: ${MOODLE_LAB_DB_PASSWORD:?Set MOODLE_LAB_DB_PASSWORD in .env.moodle}
      MOODLE_LAB_URL: ${MOODLE_LAB_URL:-http://localhost:8000}
      MOODLE_LAB_ADMIN_USER: ${MOODLE_LAB_ADMIN_USER:-admin}
      MOODLE_LAB_ADMIN_PASSWORD: ${MOODLE_LAB_ADMIN_PASSWORD:?Set MOODLE_LAB_ADMIN_PASSWORD in .env.moodle}
      MOODLE_LAB_ADMIN_EMAIL: ${MOODLE_LAB_ADMIN_EMAIL:-admin@example.invalid}
      MOODLE_LAB_FULLNAME: ${MOODLE_LAB_FULLNAME:-Управление ЭО на веб-платформе — локальный стенд}
      MOODLE_LAB_SHORTNAME: ${MOODLE_LAB_SHORTNAME:-EO Web Lab}
      PHP_INI-max_input_vars: "5000"
      PHP_INI-memory_limit: 512M
      PHP_INI-upload_max_filesize: 64M
      PHP_INI-post_max_size: 80M
      PHP_INI-max_execution_time: "300"
      PHP_INI-date.timezone: UTC
    ports:
      - "127.0.0.1:${MOODLE_LAB_PORT:-8000}:80"
    volumes:
      - moodle-data:/var/www/moodledata
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "su", "-s", "/bin/sh", "www-data", "-c", "php /opt/moodle-lab/health.php"]
      interval: 30s
      timeout: 15s
      start_period: 5m
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  moodle-data:
